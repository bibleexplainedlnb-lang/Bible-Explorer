kind = "mobile"
previewPath = "/mobile/"
title = "Bible Explorer Mobile"
version = "1.0.0"
id = "artifacts/bible-explorer-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22762

[services.development]
run = "npm --prefix artifacts/bible-explorer-mobile run dev"

[services.production]
build = [ "npm", "--prefix", "artifacts/bible-explorer-mobile", "run", "build" ]
run = [ "npm", "--prefix", "artifacts/bible-explorer-mobile", "run", "serve" ]

[services.env]
PORT = "22762"
BASE_PATH = "/mobile/"
